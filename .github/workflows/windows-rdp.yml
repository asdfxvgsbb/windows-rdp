name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 0. Check CPU & RAM
        run: |
          Write-Host "===== CPU INFO =====" -ForegroundColor Cyan
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "CPU Name : $($cpu.Name)"
          Write-Host "Cores    : $($cpu.NumberOfCores)"
          Write-Host "Threads  : $($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM(GB)  : $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1))"

      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Start Free Serveo Tunnel (no key needed)
        run: |
          Write-Host "Starting Serveo TCP tunnel for RDP(3389)..."
          # 后台启动 ssh 反向隧道（免注册免密钥）
          $tunnel = Start-Process -FilePath "ssh" -ArgumentList "-o","StrictHostKeyChecking=no","-o","ServerAliveInterval=60","-o","ServerAliveCountMax=3","-N","-R","3389:localhost:3389","serveo.net" -RedirectStandardOutput "C:\tunnel.log" -RedirectStandardError "C:\tunnel.err" -PassThru -NoNewWindow
          Start-Sleep -Seconds 20
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host " >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host ""
          Write-Host " [隧道输出]" -ForegroundColor Yellow
          if (Test-Path "C:\tunnel.log") { Get-Content "C:\tunnel.log" }
          if (Test-Path "C:\tunnel.err") { Get-Content "C:\tunnel.err" }
          Write-Host ""
          Write-Host " [登录信息]" -ForegroundColor Yellow
          Write-Host " 用户名 : NvdAdmin"
          Write-Host " 密码   : P@ssw0rd1qazXSW@#"
          Write-Host ""
          Write-Host " >> 手机/电脑打开远程桌面(mstsc)，填上面隧道给出的地址和端口" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
